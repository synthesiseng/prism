name: Native qualification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-qualification.yml
      - packages/html-canvas/**
      - packages/core/**
      - packages/math/**
      - apps/prism-atlantic/**
      - scripts/check-package-readme.mjs
      - scripts/prepare-package.mjs
      - tests/e2e/**
      - scripts/native-compatibility-spike.mjs
      - scripts/assert-native-result.mjs
      - playwright*.config.ts
      - tsconfig*.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/native-qualification.yml
      - packages/html-canvas/**
      - packages/core/**
      - packages/math/**
      - apps/prism-atlantic/**
      - scripts/check-package-readme.mjs
      - scripts/prepare-package.mjs
      - tests/e2e/**
      - scripts/native-compatibility-spike.mjs
      - scripts/assert-native-result.mjs
      - playwright*.config.ts
      - tsconfig*.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      CI: "1"
      CFT_VERSION: "158.0.8115.0"
      CFT_SHA256: "4bab3b7587693298e6058cef8184bff990d51037acbab82668ef7e30ac6c3bc5"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Record source and runner
        run: |
          EVIDENCE="$RUNNER_TEMP/native-qualification"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          test "$RUNNER_OS/$RUNNER_ARCH" = "macOS/ARM64"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'source=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner=%s/%s\nimage=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            uname -srm
            sw_vers
            node --version
            pnpm --version
            shasum -a 256 pnpm-lock.yaml scripts/native-compatibility-spike.mjs scripts/assert-native-result.mjs
            shasum -a 256 tests/e2e/spike/index.html playwright.native.config.ts .github/workflows/native-qualification.yml
          } > "$EVIDENCE/environment.txt"
      - run: pnpm install --frozen-lockfile
      - name: Download exact official test browser
        id: browser
        run: |
          browser_dir="$RUNNER_TEMP/chrome-for-testing-$CFT_VERSION"
          mkdir -p "$browser_dir"
          url="https://storage.googleapis.com/chrome-for-testing-public/$CFT_VERSION/mac-arm64/chrome-mac-arm64.zip"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --max-time 120 \
            "https://googlechromelabs.github.io/chrome-for-testing/$CFT_VERSION.json" -o "$EVIDENCE/browser-metadata.json"
          node --input-type=module - "$EVIDENCE/browser-metadata.json" "$CFT_VERSION" "$url" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const [file, version, url] = process.argv.slice(2);
          const metadata = JSON.parse(readFileSync(file, 'utf8'));
          assert.equal(metadata.version, version);
          assert.equal(metadata.downloads.chrome.find(item => item.platform === 'mac-arm64')?.url, url);
          NODE
          printf '%s\n' "$url" > "$EVIDENCE/browser-url.txt"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --max-time 120 \
            "$url" -o "$browser_dir/chrome.zip"
          shasum -a 256 "$browser_dir/chrome.zip" > "$EVIDENCE/browser-sha256.txt"
          printf '%s  %s\n' "$CFT_SHA256" "$browser_dir/chrome.zip" | shasum -a 256 -c -
          unzip -q "$browser_dir/chrome.zip" -d "$browser_dir"
          browser="$browser_dir/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$browser" --version | tee "$EVIDENCE/browser-version.txt"
          test "$("$browser" --version)" = "Google Chrome for Testing $CFT_VERSION " || \
            test "$("$browser" --version)" = "Google Chrome for Testing $CFT_VERSION"
          shasum -a 256 "$browser" >> "$EVIDENCE/browser-sha256.txt"
          pnpm exec playwright --version >> "$EVIDENCE/environment.txt"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Collect and require native pixels and clicks
        run: |
          node scripts/native-compatibility-spike.mjs "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" "$EVIDENCE/native.json" 2>&1 | tee "$EVIDENCE/collector.log"
          node scripts/assert-native-result.mjs "$EVIDENCE/native.json" "$CFT_VERSION" "$GITHUB_SHA" 2>&1 | tee "$EVIDENCE/assertions.log"
      - name: Require native lifecycle
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE="$EVIDENCE/lifecycle.json" pnpm e2e:native --retries=0 --workers=1 --reporter=list,json 2>&1 | tee "$EVIDENCE/lifecycle.log"
          node --input-type=module - "$EVIDENCE/lifecycle.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.stats.expected, 11, 'all eleven native lifecycle and layout tests, including content shrink, passed');
          for (const field of ['unexpected', 'skipped', 'flaky']) assert.equal(report.stats[field], 0, field);
          assert.deepEqual(report.errors, [], 'no test runner errors');
          NODE
      - name: Pack the candidate for Atlantic
        run: |
          mkdir -p "$EVIDENCE/atlantic-package"
          npm pack --json --pack-destination "$EVIDENCE/atlantic-package" > "$EVIDENCE/atlantic-package/pack.json"
          archive=$(node --input-type=module - "$EVIDENCE/atlantic-package/pack.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import path from 'node:path';
          const packs = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(packs.length, 1);
          assert.equal(path.basename(packs[0].filename), packs[0].filename);
          console.log(packs[0].filename);
          NODE
          )
          shasum -a 256 "$EVIDENCE/atlantic-package/$archive" > "$EVIDENCE/atlantic-package/sha256.txt"
          tar -xzf "$EVIDENCE/atlantic-package/$archive" -C "$EVIDENCE/atlantic-package"
          node scripts/check-package-readme.mjs "$EVIDENCE/atlantic-package/package"
          {
            printf 'PRISM_PACKAGE_DIR=%s\n' "$EVIDENCE/atlantic-package/package"
            printf 'PRISM_PACKAGE_VERSION=%s\n' "$(node -p 'require("./package.json").version')"
            printf 'PRISM_PACKAGE_ORIGIN=candidate:%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_ENV"
      - name: Require Atlantic candidate interactions and shrink
        run: |
          ATLANTIC_RESULTS_DIR="$EVIDENCE/atlantic-results" PLAYWRIGHT_JSON_OUTPUT_FILE="$EVIDENCE/atlantic.json" \
            pnpm exec playwright test --config playwright.atlantic.config.ts --retries=0 --reporter=list,json 2>&1 | tee "$EVIDENCE/atlantic.log"
          node --input-type=module - "$EVIDENCE/atlantic.json" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.stats.expected, 7, 'six native Atlantic cases and the unsupported-browser gate passed');
          assert.equal(report.stats.skipped, 5, 'only cross-project exclusions');
          for (const field of ['unexpected', 'flaky']) assert.equal(report.stats[field], 0, field);
          assert.deepEqual(report.errors, []);
          const visit = suites => suites.flatMap(suite => [...(suite.specs ?? []), ...visit(suite.suites ?? [])]);
          const specs = visit(report.suites);
          const titles = [
            'packaged Atlantic interaction, resize and current PNG export',
            'visible dataset dates and wind units match the committed data',
            'unsupported browser shows the native composition gate',
            'Atlantic measures shrinking inner content instead of its previous surface height'
          ];
          const seen = new Set();
          for (const spec of specs) for (const test of spec.tests) {
            assert.ok(titles.includes(spec.title), 'known acceptance case');
            const key = `${test.projectName}:${spec.title}`;
            assert.ok(!seen.has(key), 'one result per case/project');
            seen.add(key);
            const unsupported = spec.title === 'unsupported browser shows the native composition gate';
            assert.ok(['native-dpr1', 'native-dpr2', 'unsupported'].includes(test.projectName));
            const runs = unsupported === (test.projectName === 'unsupported');
            assert.equal(test.status, runs ? 'expected' : 'skipped');
            assert.equal(test.results.length, 1);
            assert.equal(test.results[0].status, runs ? 'passed' : 'skipped');
          }
          assert.equal(seen.size, 12, 'complete three-project/four-case matrix');
          NODE
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-qualification/
          if-no-files-found: error
          retention-days: 7
