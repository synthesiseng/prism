name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prism/docs build

  e2e:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      CI: "1"
      CFT_VERSION: "158.0.8115.0"
      CFT_SHA256: "4bab3b7587693298e6058cef8184bff990d51037acbab82668ef7e30ac6c3bc5"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Record source and runner
        run: |
          EVIDENCE="$RUNNER_TEMP/e2e-qualification"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          test "$RUNNER_OS/$RUNNER_ARCH" = "macOS/ARM64"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'source=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner=%s/%s\nimage=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            uname -srm
            sw_vers
            node --version
            pnpm --version
            shasum -a 256 pnpm-lock.yaml playwright.config.ts
            shasum -a 256 tests/e2e/fixture/lifecycle-fixture.ts .github/workflows/ci.yml
          } > "$EVIDENCE/environment.txt"
      - run: pnpm install --frozen-lockfile
      - name: Download exact official test browser
        id: browser
        run: |
          browser_dir="$RUNNER_TEMP/chrome-for-testing-$CFT_VERSION"
          mkdir -p "$browser_dir"
          url="https://storage.googleapis.com/chrome-for-testing-public/$CFT_VERSION/mac-arm64/chrome-mac-arm64.zip"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --max-time 120 \
            "https://googlechromelabs.github.io/chrome-for-testing/$CFT_VERSION.json" -o "$EVIDENCE/browser-metadata.json"
          node --input-type=module - "$EVIDENCE/browser-metadata.json" "$CFT_VERSION" "$url" <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const [file, version, url] = process.argv.slice(2);
          const metadata = JSON.parse(readFileSync(file, 'utf8'));
          assert.equal(metadata.version, version);
          assert.equal(metadata.downloads.chrome.find(item => item.platform === 'mac-arm64')?.url, url);
          NODE
          printf '%s\n' "$url" > "$EVIDENCE/browser-url.txt"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --max-time 120 \
            "$url" -o "$browser_dir/chrome.zip"
          shasum -a 256 "$browser_dir/chrome.zip" > "$EVIDENCE/browser-sha256.txt"
          printf '%s  %s\n' "$CFT_SHA256" "$browser_dir/chrome.zip" | shasum -a 256 -c -
          unzip -q "$browser_dir/chrome.zip" -d "$browser_dir"
          browser="$browser_dir/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$browser" --version | tee "$EVIDENCE/browser-version.txt"
          test "$("$browser" --version)" = "Google Chrome for Testing $CFT_VERSION " || \
            test "$("$browser" --version)" = "Google Chrome for Testing $CFT_VERSION"
          shasum -a 256 "$browser" >> "$EVIDENCE/browser-sha256.txt"
          pnpm exec playwright --version >> "$EVIDENCE/environment.txt"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Require fallback lifecycle
        run: pnpm e2e --retries=0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm pack --json

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
